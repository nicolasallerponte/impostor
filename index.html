<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Impostor · fútbol</title>
  <meta name="description" content="El juego del impostor con futbolistas de LaLiga, Sudamérica y leyendas. Cada uno en su móvil.">
  <meta name="theme-color" content="#0c0c0b">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Impostor">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&display=swap">
  <link rel="modulepreload" href="players.js?v=9">
  <link rel="modulepreload" href="config.js?v=9">
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
  <div id="app"><main class="screen center"><p class="muted">Cargando…</p></main></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript>Activa JavaScript para jugar.</noscript>
  <script>
    // Vigilante de arranque: si la app no arranca (caché con versiones mezcladas, red caída...),
    // limpia la caché y recarga una vez sola; si vuelve a fallar, ofrece un botón.
    window.__repair = async function () {
      try { sessionStorage.setItem("imp.repaired", "1"); } catch (e) {}
      try { const rs = await navigator.serviceWorker?.getRegistrations(); await Promise.all((rs || []).map((r) => r.unregister())); } catch (e) {}
      try { const ks = await caches.keys(); await Promise.all(ks.map((k) => caches.delete(k))); } catch (e) {}
      const q = new URLSearchParams(location.search); q.set("r", Date.now());
      location.replace(location.pathname + "?" + q);
    };
    window.__bootFail = function () {
      if (window.__booted || window.__failShown) return;
      let tried = false; try { tried = sessionStorage.getItem("imp.repaired") === "1"; } catch (e) {}
      if (!tried) return window.__repair();
      window.__failShown = true;
      document.getElementById("app").innerHTML = '<main class="screen center"><p class="center-t">La app no ha podido arrancar.</p>' +
        '<p class="muted center-t small">' + (navigator.onLine ? "Pulsa reparar. Si sigue igual, puede que tu red bloquee Firebase (www.gstatic.com)." : "No tienes conexión.") + '</p>' +
        '<button class="btn primary" onclick="__repair()">Reparar y recargar</button></main>';
    };
    setTimeout(window.__bootFail, 10000);
  </script>
  <script type="module" src="app.js?v=9" onerror="__bootFail()"></script>
  <script>
    if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
  </script>
</body>
</html>
